name: "Build & Release Android"

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: windows-latest
    permissions:
      contents: write # Allows the runner to create tags and releases
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for changelog

      - name: Setup-Java
        uses: actions/setup-java@v3.12.0
        with:
          distribution: "oracle"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: "stable"

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Generation
        run: dart run build_runner build

      - name: Auto-bump build number in pubspec
        shell: powershell
        run: |
          $file = "pubspec.yaml"
          $content = Get-Content $file
          $updated = $content | ForEach-Object {
              if ($_ -match '^(version:\s*[0-9\.]+\+)(\d+)$') {
                  $newBuild = [int]$matches[2] + 1
                  Write-Host "Bumping build number to $newBuild"
                  "$($matches[1])$newBuild"
              } else {
                  $_
              }
          }
          Set-Content -Path $file -Value $updated -Encoding UTF8

      - name: Commit and Push bumped version
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "ignore: auto-bump build number [skip ci]"
          git push

      - name: Extract bumped version from pubspec.yaml
        shell: powershell
        run: |
          $vLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          if (-not $vLine) { Write-Error 'version not found in pubspec.yaml'; exit 1 }
          $fullVersion = $vLine.Matches[0].Groups[1].Value
          $parts = $fullVersion -split '\+'
          $ver = $parts[0]
          $build = if ($parts.Count -gt 1) { $parts[1] } else { "1" }
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$ver" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_NUMBER=$build" -Encoding utf8

      - name: Create keystore file
        shell: powershell
        run: |
          $appDir = Join-Path $env:GITHUB_WORKSPACE "android\app"
          if (-not (Test-Path $appDir)) { New-Item -ItemType Directory -Force -Path $appDir }
          $b64 = "${{ secrets.KEY_STORE }}" -replace "`r|`n", ""
          $filename = Join-Path $appDir "upload-keystore.jks"
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes($filename, $bytes)

      - name: Create Keystore properties
        shell: powershell
        run: |
          $props = @"
          keyPassword=${{ secrets.KEY_PASSWORD }}
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          "@
          [System.IO.File]::WriteAllText("android\key.properties", $props, [System.Text.UTF8Encoding]::new($false))

      - name: Build App files
        run: flutter build apk --release --split-per-abi

      - name: Verify Sign
        shell: powershell
        run: |
          $buildToolsDir = Get-ChildItem "$env:ANDROID_HOME\build-tools" | Where-Object { $_.PSIsContainer } | Sort-Object Name -Descending | Select-Object -First 1
          Write-Host "Using build tools version: $($buildToolsDir.Name)"
          & "$($buildToolsDir.FullName)\apksigner.bat" verify build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          & "$($buildToolsDir.FullName)\apksigner.bat" verify build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          & "$($buildToolsDir.FullName)\apksigner.bat" verify build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Rename APK files
        shell: powershell
        run: |
          Rename-Item -Path "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" -NewName "quicksnap_android_v$($env:VERSION)+$($env:BUILD_NUMBER)_armeabi-v7a.apk"
          Rename-Item -Path "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" -NewName "quicksnap_android_v$($env:VERSION)+$($env:BUILD_NUMBER)_arm64-v8a.apk"
          Rename-Item -Path "build/app/outputs/flutter-apk/app-x86_64-release.apk" -NewName "quicksnap_android_v$($env:VERSION)+$($env:BUILD_NUMBER)_x86_64.apk"

      - name: Create build-number.txt file
        shell: powershell
        run: Set-Content -Path build-number.txt -Value "${{ env.BUILD_NUMBER }}" -Encoding utf8

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Release-Android
          path: |
            build/app/outputs/flutter-apk/quicksnap_android_v${{ env.VERSION }}+${{ env.BUILD_NUMBER }}_armeabi-v7a.apk
            build/app/outputs/flutter-apk/quicksnap_android_v${{ env.VERSION }}+${{ env.BUILD_NUMBER }}_arm64-v8a.apk
            build/app/outputs/flutter-apk/quicksnap_android_v${{ env.VERSION }}+${{ env.BUILD_NUMBER }}_x86_64.apk
            build-number.txt

      - name: Build Changelog
        id: github_release_notes
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: "COMMIT"
          configuration: ".github/configuration.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          body: ${{ steps.github_release_notes.outputs.changelog }}
          artifacts: |
            build/app/outputs/flutter-apk/quicksnap_android_v${{ env.VERSION }}+${{ env.BUILD_NUMBER }}_armeabi-v7a.apk
            build/app/outputs/flutter-apk/quicksnap_android_v${{ env.VERSION }}+${{ env.BUILD_NUMBER }}_arm64-v8a.apk
            build/app/outputs/flutter-apk/quicksnap_android_v${{ env.VERSION }}+${{ env.BUILD_NUMBER }}_x86_64.apk
            build-number.txt
          tag: v${{ env.VERSION }}+${{ env.BUILD_NUMBER }}
          token: ${{secrets.GITHUB_TOKEN}}
          prerelease: false
          allowUpdates: true